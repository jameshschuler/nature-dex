# Render Blueprint: a static site built from this repo. Node version comes from .node-version.
services:
  - type: web
    name: nature-hunter-dex
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Deploy main only after the GitHub CI checks pass.
    autoDeployTrigger: checksPass
    previews:
      generation: automatic
    headers:
      # The whole app is one HTML file, so always revalidate it.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
